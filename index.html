<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ONE BANK Cooperative</title>
<script>
var ADMIN_EMAIL="expressdeliverycustomercare9@gmail.com";
function showPage(id){var pages=["home","join","pay","login","member","admin","org"];for(var i=0;i<pages.length;i++){var e=document.getElementById("p-"+pages[i]);if(e){e.style.display="none"}}var t=document.getElementById("p-"+id);if(!t){alert("Page not found: "+id);return} t.style.display="block";var btns=document.querySelectorAll(".navBtn");for(var j=0;j<btns.length;j++){btns[j].classList.remove("on")}var cur=document.querySelectorAll('[data-nav="'+id+'"]');for(var k=0;k<cur.length;k++){cur[k].classList.add("on")}window.scrollTo(0,0);var dbg=document.getElementById("dbg");if(dbg)dbg.innerText="Page: "+id+" — FOUND ✓"; if(id==="admin") renderAdmin(); if(id==="member") renderMember(); if(id==="home") renderHomeProducts();}
function pickPlan(p){var s=document.getElementById("jPlan");if(s)s.value=p;var l=document.getElementById("joinPlanLabel");if(l)l.innerText="Selected Plan: ₦"+Number(p).toLocaleString();showPage("join")}
function calcNow(){try{var d=parseInt(document.getElementById("calcDirect").value)||5;document.getElementById("calcD").innerText=d;var a=d*7500,b=d*3*3000;document.getElementById("calcOut").innerText="You could earn: ₦"+(a+b).toLocaleString();document.getElementById("calcDetail").innerText="Direct: "+d+" × ₦7,500 = ₦"+a.toLocaleString()+" + Indirect: "+(d*3)+" × ₦3,000 = ₦"+b.toLocaleString()}catch(e){}}
function calcPlus(n){var el=document.getElementById("calcDirect");var v=parseInt(el.value)||5;v+=n;if(v<1)v=1;if(v>20)v=20;el.value=v;calcNow()}
function orderEmail(n){window.location.href="mailto:onebankcommunity@gmail.com?subject="+encodeURIComponent("ONE BANK Order: "+n)+"&body="+encodeURIComponent("Hi ONE BANK,\nI want to order: "+n+"\nMy Name:\nMy Phone:\nDelivery Area:")}
function orderChat(n){alert("Opening Google Chat — Send: Hi ONE BANK, I want to order: "+n);window.open("https://chat.google.com/","_blank")}
function doOrder(n,p){try{var o=JSON.parse(localStorage.getItem("ob_orders")||"[]");o.unshift({id:Date.now().toString(),member:(window.current&&current.name)||"Guest",product:n,price:p,date:new Date().toLocaleDateString(),status:"Pending"});localStorage.setItem("ob_orders",JSON.stringify(o))}catch(e){}orderEmail(n)}
function imgFallback(el){el.onerror=null;el.src="https://via.placeholder.com/600x360/0A1931/D4AF6A?text=ONE+BANK"}
var BANKS=["Access Bank","Citibank Nigeria","Ecobank Nigeria","Fidelity Bank","First Bank of Nigeria","FCMB","GTBank","Heritage Bank","Jaiz Bank","Keystone Bank","Kuda MFB","Moniepoint MFB","OPay","PalmPay","Polaris Bank","Providus Bank","Stanbic IBTC","Standard Chartered","Sterling Bank","SunTrust Bank","Union Bank","UBA","Unity Bank","Wema Bank","Zenith Bank","ALAT by Wema","Carbon","FairMoney MFB","GoMoney","Rubies Bank","Sparkle","VFD MFB","Lotus Bank","TAJBank","Globus Bank","Parallex Bank","PremiumTrust Bank","Signature Bank"];
function fillBanks(){var h='<option value="">-- Select Your Bank --</option>';for(var i=0;i<BANKS.length;i++){h+='<option>'+BANKS[i]+'</option>'}var a=document.getElementById("jBank");if(a)a.innerHTML=h;var b=document.getElementById("wBankSelect");if(b)b.innerHTML=h;var c=document.getElementById("payFromBank");if(c)c.innerHTML=h;var d=document.getElementById("editBank");if(d)d.innerHTML=h}
function getMembers(){try{return JSON.parse(localStorage.getItem("ob_members")||"[]")}catch(e){return []}}
function saveMembers(m){localStorage.setItem("ob_members",JSON.stringify(m))}
function getWithdrawals(){try{return JSON.parse(localStorage.getItem("ob_withdrawals")||"[]")}catch(e){return []}}
function saveWithdrawals(w){localStorage.setItem("ob_withdrawals",JSON.stringify(w))}
function getProducts(){try{return JSON.parse(localStorage.getItem("ob_products")||"[]")}catch(e){return []}}
function switchLogin(type){document.getElementById("memberLoginBox").style.display=type==="member"?"block":"none";document.getElementById("adminLoginBox").style.display=type==="admin"?"block":"none";document.getElementById("tabMember").className=type==="member"?"on":"";document.getElementById("tabAdmin").className=type==="admin"?"on":"";}
function doMemberLogin(){var phone=document.getElementById("mPhone").value.trim();var pass=document.getElementById("mPass").value;var err=document.getElementById("loginErr");var m=getMembers().find(function(x){return x.phone===phone});if(!m){err.style.display="block";err.innerText="No member found with this phone. Please Join first.";return}if(m.password!==pass){err.style.display="block";err.innerText="Wrong password.";return}if(m.status!=="approved"){err.style.display="block";err.innerText="Your account is pending admin approval. Please wait.";return}window.current=m;localStorage.setItem("ob_current",JSON.stringify(m));showPage("member");}
function doAdminLogin(){var email=document.getElementById("aEmail").value.trim();var pass=document.getElementById("aPass").value;var err=document.getElementById("loginErr");if(email!==ADMIN_EMAIL){err.style.display="block";err.innerText="Wrong admin email.";return}if(!pass){err.style.display="block";err.innerText="Enter admin password.";return}localStorage.setItem("ob_admin","1");showPage("admin");}
function doJoin(){var name=document.getElementById("jName").value.trim();var phone=document.getElementById("jPhone").value.trim();var pass=document.getElementById("jPass").value;var bank=document.getElementById("jBank").value;var acct=document.getElementById("jAcct").value.trim();var acctName=document.getElementById("jAcctName").value.trim();var plan=document.getElementById("jPlan").value;var ref=document.getElementById("jRef").value.trim()||"ADMIN01";var err=document.getElementById("joinErr");if(!name||!phone||!pass||!bank||!acct||!acctName){err.style.display="block";err.innerText="Fill all fields.";return}if(acct.length!==10){err.style.display="block";err.innerText="Account Number must be 10 digits.";return}if(getMembers().find(function(m){return m.phone===phone})){err.style.display="block";err.innerText="This phone is already registered. Please login.";return}var code="OB-100"+(getMembers().length+1);var member={code:code,name:name,phone:phone,password:pass,bank:bank,acct:acct,acctName:acctName,plan:plan,amount:Number(plan),referral:ref,status:"pending",createdAt:new Date().toISOString(),total:0};var list=getMembers();list.push(member);saveMembers(list);window.current=member;localStorage.setItem("ob_current",JSON.stringify(member));document.getElementById("payAmount").innerText="Pay ₦"+Number(plan).toLocaleString();document.getElementById("payCode").innerText="Your Member Code: "+code;showPage("pay");}
function submitPayment(){var sender=document.getElementById("paySender").value.trim();var ref=document.getElementById("payRef").value.trim();if(!sender||!ref){alert("Enter Sender Name and Payment Reference");return}var m=window.current||JSON.parse(localStorage.getItem("ob_current")||"null");if(m){var list=getMembers().map(function(x){if(x.phone===m.phone) return Object.assign({},x,{senderName:sender,payRef:ref});return x});saveMembers(list);}alert("Submitted for approval. Wait for admin approval, then login.");showPage("login");}
function renderHomeProducts(){var prods=getProducts();var box=document.getElementById("homeNewProducts");if(box){box.innerHTML=!prods.length?"":prods.map(function(p){return "<div class='card'><b>"+p.name+"</b><div class='price'>₦"+Number(p.price).toLocaleString()+"</div><span class='tag'>New • In Stock</span><br><br><button class='btnN' style='width:100%' onclick=\"doOrder('"+p.name+"',"+p.price+")\">Order via Email</button></div>"}).join("")}var ann=localStorage.getItem("ob_announcement")||"";var ab=document.getElementById("homeAnnouncement");if(ab)ab.innerText=ann?ann:"";var timer=document.getElementById("dropTimer");if(timer){var d=new Date();d.setDate(d.getDate()+((5-d.getDay()+7)%7));timer.innerText="Friday Drop ends: "+d.toDateString()}}
function renderAdmin(){var members=getMembers();var withdrawals=getWithdrawals();var pending=members.filter(function(m){return m.status!=="approved"});var pendingW=withdrawals.filter(function(w){return w.status==="pending"});var today=new Date().toDateString();var weekAgo=Date.now()-7*24*60*60*1000;var daily=members.filter(function(m){return (m.createdAt?new Date(m.createdAt).toDateString():today)===today}).length;var weekly=members.filter(function(m){return new Date(m.createdAt||Date.now()).getTime()>=weekAgo}).length;var orders=JSON.parse(localStorage.getItem("ob_orders")||"[]");var el=document.getElementById("adminStats");if(el)el.innerHTML="<b>Total Members: "+members.length+"</b><br>Today: "+daily+" • This Week: "+weekly+" • Total: "+members.length+"<br>Pending Approvals: "+pending.length+" • Pending Withdrawals: "+pendingW.length+" • Total Orders: "+orders.length;var ph=document.getElementById("adminPending");if(ph){ph.innerHTML=!pending.length?"<p>No pending</p>":pending.map(function(m){return "<div style='border:1px solid #eee;padding:10px;margin:8px 0;border-radius:10px;font-size:13px'><b>"+(m.name||"")+"</b> — "+(m.phone||"")+"<br>Plan: ₦"+Number(m.amount||0).toLocaleString()+" — Ref: "+(m.payRef||m.ref||"-")+"<br>Bank: "+(m.bank||"")+" — "+(m.acct||"")+" — "+(m.acctName||"")+"<br><button onclick=\"approveMember('"+m.phone+"')\" style='background:#065F46;color:#fff;padding:10px 16px;border:0;border-radius:99px;margin-top:8px'>Approve</button></div>"}).join("")}var wh=document.getElementById("adminWithdrawals");if(wh){wh.innerHTML=!pendingW.length?"<p>No withdrawals</p>":pendingW.map(function(w){return "<div style='border:1px solid #eee;padding:10px;margin:8px 0;border-radius:10px;font-size:13px'><b>"+(w.name||"")+"</b> — "+(w.phone||"")+" — ₦"+Number(w.amount||0).toLocaleString()+"<br>Bank: "+(w.bank||"")+" — "+(w.acct||"")+" — "+(w.acctName||"")+"<br><button onclick=\"payWithdrawal('"+w.id+"')\" style='background:#0A1931;color:#fff;padding:10px 16px;border:0;border-radius:99px;margin-top:8px'>Mark as Paid — Confirm</button></div>"}).join("")}var al=document.getElementById("adminAll");if(al)al.innerHTML=members.map(function(m){return "<div style='border-bottom:1px solid #eee;padding:8px 0;font-size:13px'>"+(m.code||"")+" — "+(m.name||"")+" — "+(m.phone||"")+" — ₦"+Number(m.amount||0).toLocaleString()+" — "+(m.status==="approved"?"✅":"⏳ Pending")+"</div>"}).join("");var bl=document.getElementById("adminBonus");if(bl){var log=JSON.parse(localStorage.getItem("ob_bonus_log")||"[]");bl.innerHTML=!log.length?"<p>No bonus splits yet. Approve a member to trigger.</p>":log.map(function(b){return "<div style='font-size:13px;border-bottom:1px solid #eee;padding:6px 0'>"+b.date+" — "+b.to+" — "+b.type+" — ₦"+Number(b.amount).toLocaleString()+"</div>"}).join("")}var od=document.getElementById("adminOrders");if(od)od.innerHTML=!orders.length?"<p>No orders</p>":orders.map(function(o){return "<div style='font-size:13px;border-bottom:1px solid #eee;padding:8px 0'>"+o.member+" — "+o.product+" — ₦"+Number(o.price||0).toLocaleString()+" — "+(o.status||"Pending")+" <button onclick=\"markShipped('"+o.id+"')\" style='text-decoration:underline;background:none;border:0'>Mark Shipped</button></div>"}).join("");var annInput=document.getElementById("adminAnnInput");if(annInput)annInput.value=localStorage.getItem("ob_announcement")||"";}
function approveMember(phone){var members=getMembers();var log=JSON.parse(localStorage.getItem("ob_bonus_log")||"[]");var updated=members.map(function(m){if(m.phone===phone){if(m.referral&&m.referral!=="ADMIN01"){log.push({date:new Date().toLocaleString(),to:m.referral,type:"Direct Bonus",amount:Math.round(Number(m.amount||0)*0.25)})}log.push({date:new Date().toLocaleString(),to:m.name,type:"First Sale",amount:Math.round(Number(m.amount||0)*0.10)});return Object.assign({},m,{status:"approved"})}return m});saveMembers(updated);localStorage.setItem("ob_bonus_log",JSON.stringify(log));renderAdmin();alert("Approved! Bonus split logged.");}
function payWithdrawal(id){var w=getWithdrawals().map(function(x){if(x.id===id)return Object.assign({},x,{status:"paid"});return x});saveWithdrawals(w);renderAdmin();alert("Marked as Paid. Member will see Paid in dashboard.");}
function markShipped(id){var o=JSON.parse(localStorage.getItem("ob_orders")||"[]").map(function(x){if(x.id===id)return Object.assign({},x,{status:"Shipped"});return x});localStorage.setItem("ob_orders",JSON.stringify(o));renderAdmin();}
function searchMembers(){var q=(document.getElementById("adminSearch").value||"").toLowerCase();var members=getMembers().filter(function(m){return (m.name||"").toLowerCase().indexOf(q)>-1||(m.phone||"").indexOf(q)>-1||(m.code||"").toLowerCase().indexOf(q)>-1});var al=document.getElementById("adminAll");if(al)al.innerHTML=members.map(function(m){return "<div style='font-size:13px;border-bottom:1px solid #eee;padding:8px 0'>"+(m.code||"")+" — "+(m.name||"")+" — "+(m.phone||"")+"</div>"}).join("")}
function addProduct(){var n=document.getElementById("newProdName").value.trim();var p=document.getElementById("newProdPrice").value;if(!n||!p){alert("Enter name and price");return}var list=getProducts();list.push({id:Date.now().toString(),name:n,price:Number(p)});localStorage.setItem("ob_products",JSON.stringify(list));document.getElementById("newProdName").value="";document.getElementById("newProdPrice").value="";alert("Product added — now live on Home");}
function publishAnn(){var v=document.getElementById("adminAnnInput").value;localStorage.setItem("ob_announcement",v);alert("Announcement published to Home");}
function renderMember(){var m=window.current||JSON.parse(localStorage.getItem("ob_current")||"null");if(!m)return;var fresh=getMembers().find(function(x){return x.phone===m.phone})||m;window.current=fresh;document.getElementById("memName").innerText=fresh.name||"";document.getElementById("memCode").innerText=fresh.code||"";document.getElementById("memPlan").innerText="Plan: ₦"+Number(fresh.amount||0).toLocaleString();var directs=getMembers().filter(function(x){return x.referral===fresh.code});document.getElementById("memDirects").innerText=directs.length;document.getElementById("memLink").innerText="Your Link: "+location.origin+"/?ref="+fresh.code;var w=getWithdrawals().filter(function(x){return x.phone===fresh.phone});document.getElementById("memWithdrawals").innerHTML=!w.length?"<p>No withdrawals yet</p>":w.map(function(x){return "<div style='font-size:13px;border-bottom:1px solid #eee;padding:6px 0'>₦"+Number(x.amount).toLocaleString()+" — "+x.status+" — "+(x.date||"")+"</div>"}).join("");document.getElementById("editBank").value=fresh.bank||"";document.getElementById("editAcct").value=fresh.acct||"";document.getElementById("editAcctName").value=fresh.acctName||"";}
function saveBankDetails(){var m=window.current;if(!m)return;var bank=document.getElementById("editBank").value;var acct=document.getElementById("editAcct").value.trim();var acctName=document.getElementById("editAcctName").value.trim();if(!bank||!acct||!acctName){alert("Fill all bank fields");return}if(acct.length!==10){alert("Account Number must be 10 digits");return}var list=getMembers().map(function(x){if(x.phone===m.phone)return Object.assign({},x,{bank:bank,acct:acct,acctName:acctName});return x});saveMembers(list);window.current=Object.assign({},m,{bank:bank,acct:acct,acctName:acctName});localStorage.setItem("ob_current",JSON.stringify(window.current));alert("Bank details updated");}
function requestWithdrawal(){var amt=Number(document.getElementById("wAmount").value);if(!amt||amt<2000){alert("Minimum withdrawal is ₦2,000");return}var m=window.current;if(!m)return;var w=getWithdrawals();w.unshift({id:Date.now().toString(),name:m.name,phone:m.phone,amount:amt,bank:m.bank,acct:m.acct,acctName:m.acctName,status:"pending",date:new Date().toLocaleDateString()});saveWithdrawals(w);document.getElementById("wAmount").value="";renderMember();alert("Withdrawal requested. Admin will confirm.");}
function copyLink(){var t=document.getElementById("memLink").innerText.replace("Your Link: ","");navigator.clipboard.writeText(t);alert("Link copied");}
</script>
